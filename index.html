<!DOCTYPE html>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBwnx21HTz7lXK9ByFk0Cvyma6cQ3EFqIo",
  authDomain: "tranca-bdb16.firebaseapp.com",
  projectId: "tranca-bdb16",
  storageBucket: "tranca-bdb16.firebasestorage.app",
  messagingSenderId: "581913871040",
  appId: "1:581913871040:web:d5209cb2fa308a58b5e325",
  measurementId: "G-VSG09NVFQ4"
};
    
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>♣️♥️Placar Tranca♠️♦️</title>
<style>
* {
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;

    background-image: url("bg.jpg"); /* caminho da imagem */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container {
    max-width: 420px;
    margin: 40px auto; /* cria espaço em cima e embaixo */
    background: rgba(255, 255, 255, 0.92);
    padding: 16px;
    border-radius: 16px;
}

h2 {
    text-align: center;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.back {
    background: #9e9e9e;
}

button.save {
    background: #2e7d32;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

strong {
    display: block;
    margin-top: 10px;
}

.hidden {
    display: none;
}

/* Ranking */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
}

th {
    background: #eeeeee;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

/* Filtro ranking */
#rankingFilter {
    margin-bottom: 10px;
}

/* Melhor leitura em telas muito pequenas */
@media (max-width: 360px) {
    table {
        font-size: 13px;
    }
}
</style>
</head>
<body>

<div class="container">

<!-- TELA INICIAL -->
<div id="home">
    <h2>♣️♥️Placar Tranca♠️♦️</h2>
    <button onclick="showScreen('result')">Inserir Resultado</button>
    <button onclick="showScreen('ranking')">Ver Ranking</button>
    <button onclick="showScreen('duplas')">Visão Duplas</button>
    <button onclick="showScreen('newPerson')">Nova Pessoa</button>
    <button onclick="showScreen('editPerson')">Editar Pessoa</button>
</div>

<!-- RANKING -->
<div id="ranking" class="hidden">
  
    <h2>Ranking</h2>
  <select id="rankingFilter" onchange="loadRanking()">
    <option value="wins">Mais vitórias</option>
    <option value="percentage">Maior % de vitória</option>
</select>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
    </table>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- INSERIR RESULTADO -->
<div id="result" class="hidden">
    <h2>Inserir Resultado</h2>

    <strong>Dupla Vencedora</strong>
    <select id="win1" onchange="updatePlayerLocks()"></select>
    <select id="win2" onchange="updatePlayerLocks()"></select>

    <strong>Dupla Perdedora</strong>
    <select id="lose1" onchange="updatePlayerLocks()"></select>
    <select id="lose2" onchange="updatePlayerLocks()"></select>

    <button class="save" onclick="saveResult()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- NOVA PESSOA -->
<div id="newPerson" class="hidden">
    <h2>Nova Pessoa</h2>
    <input id="newName" placeholder="Nome da pessoa">
    <button class="save" onclick="addPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- EDITAR PESSOA -->
<div id="editPerson" class="hidden">
    <h2>Editar Pessoa</h2>
    <select id="editSelect"></select>
    <input id="editName" placeholder="Novo nome">
    <button class="save" onclick="editPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>
  
<!-- VISÃO DUPLAS -->
<div id="duplas" class="hidden">
    <h2>Visão Duplas</h2>

    <select id="duplaPerson" onchange="loadDuplas()">
        <option value="">Selecione uma pessoa</option>
    </select>

    <table>
        <thead>
            <tr>
                <th>Parceiro</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="duplasBody"></tbody>
    </table>

    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

</div>

<script>
let people = [];

db.collection("people").onSnapshot(snapshot => {
    people = [];
    snapshot.forEach(doc => {
        people.push({ id: doc.id, ...doc.data() });
    });
});


function saveData() {
    localStorage.setItem("people", JSON.stringify(people));
}

function showScreen(id) {
    document.querySelectorAll(".container > div").forEach(d => d.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");

    if (id === "ranking") loadRanking();
    if (id === "result") loadCombos();
    if (id === "editPerson") loadEditCombo();
    if (id === "duplas") loadDuplasSelect();

}

function addPerson() {
    const name = newName.value.trim();
    if (!name) return alert("Informe um nome");

    db.collection("people").add({
        name,
        games: 0,
        wins: 0
    });

    newName.value = "";
}

//loadRanking começa
function loadRanking() {
    const body = document.getElementById("rankingBody");
    const filter = document.getElementById("rankingFilter").value;
    body.innerHTML = "";

    let sorted = [...people];

    if (filter === "wins") {
        sorted.sort((a, b) => b.wins - a.wins);
    } else if (filter === "percentage") {
        sorted.sort((a, b) => {
            const pctA = a.games ? a.wins / a.games : 0;
            const pctB = b.games ? b.wins / b.games : 0;
            return pctB - pctA;
        });
    }

    sorted.forEach(p => {
        const pct = p.games ? ((p.wins / p.games) * 100).toFixed(1) : 0;
        body.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.games}</td>
                <td>${p.wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}
//loadRanking termina
  
function loadCombos() {
    const sortedPeople = getPeopleSortedByName();

    ["win1","win2","lose1","lose2"].forEach(id => {
        const s = document.getElementById(id);
        s.innerHTML = "<option value=''>Selecione</option>";

        sortedPeople.forEach(p => {
            const index = people.findIndex(x => x.id === p.id);
            s.innerHTML += `<option value="${index}">${p.name}</option>`;
        });
    });

    updatePlayerLocks();
}

function saveResult() {
    const ids = [win1.value, win2.value, lose1.value, lose2.value];
    if (new Set(ids).size < 4) {
        return alert("As duplas devem ser diferentes");
    }

    ids.forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ games: firebase.firestore.FieldValue.increment(1) });
    });

    [win1.value, win2.value].forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ wins: firebase.firestore.FieldValue.increment(1) });
    });
  
  db.collection("matches").add({
    teamWin: [
        people[win1.value].id,
        people[win2.value].id
    ],
    teamLose: [
        people[lose1.value].id,
        people[lose2.value].id
    ],
    date: new Date().toISOString()
});

    alert("Resultado salvo!");
}

function loadEditCombo() {
    const s = document.getElementById("editSelect");
    s.innerHTML = "";

    getPeopleSortedByName().forEach(p => {
        const index = people.findIndex(x => x.id === p.id);
        s.innerHTML += `<option value="${index}">${p.name}</option>`;
    });
}

function editPerson() {
    const idx = editSelect.value;
    const newName = editName.value.trim();
    if (!newName) return;

    db.collection("people")
      .doc(people[idx].id)
      .update({ name: newName });

    editName.value = "";
}

  function updatePlayerLocks() {
    const selects = [win1, win2, lose1, lose2];

    // valores já escolhidos
    const selectedValues = selects
        .map(s => s.value)
        .filter(v => v !== "");

    selects.forEach(currentSelect => {
        [...currentSelect.options].forEach(option => {
            // nunca desabilitar a opção que já está selecionada nesse select
            if (option.value === currentSelect.value) {
                option.disabled = false;
            } else {
                option.disabled = selectedValues.includes(option.value);
            }
        });
    });
}

  function loadDuplasSelect() {
    const select = document.getElementById("duplaPerson");
    select.innerHTML = "<option value=''>Selecione uma pessoa</option>";

    getPeopleSortedByName().forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
    });
}

  async function loadDuplas() {
    const personId = document.getElementById("duplaPerson").value;
    const body = document.getElementById("duplasBody");
    body.innerHTML = "";

    if (!personId) return;

    const snapshot = await db.collection("matches").get();
    const stats = {};

    snapshot.forEach(doc => {
        const m = doc.data();

        const isWin = m.teamWin.includes(personId);
        const isLose = m.teamLose.includes(personId);

        if (!isWin && !isLose) return;

        const team = isWin ? m.teamWin : m.teamLose;
        const partnerId = team.find(id => id !== personId);

        if (!stats[partnerId]) {
            stats[partnerId] = { games: 0, wins: 0 };
        }

        stats[partnerId].games++;
        if (isWin) stats[partnerId].wins++;
    });

    Object.keys(stats).forEach(pid => {
        const partner = people.find(p => p.id === pid);
        if (!partner) return;

        const games = stats[pid].games;
        const wins = stats[pid].wins;
        const pct = games ? ((wins / games) * 100).toFixed(1) : 0;

        body.innerHTML += `
            <tr>
                <td>${partner.name}</td>
                <td>${games}</td>
                <td>${wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}

  function getPeopleSortedByName() {
    return [...people].sort((a, b) =>
        a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' })
    );
}

</script>

</body>
</html>
