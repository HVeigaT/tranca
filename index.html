<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Placar Familiar</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 420px;
    margin: auto;
    min-height: 100vh;
    background: #ffffff;
    padding: 16px;
}

h2 {
    text-align: center;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.back {
    background: #9e9e9e;
}

button.save {
    background: #2e7d32;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

strong {
    display: block;
    margin-top: 10px;
}

.hidden {
    display: none;
}

/* Ranking */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
}

th {
    background: #eeeeee;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

/* Filtro ranking */
#rankingFilter {
    margin-bottom: 10px;
}

/* Melhor leitura em telas muito pequenas */
@media (max-width: 360px) {
    table {
        font-size: 13px;
    }
}
</style>
</head>
<body>

<div class="container">

<!-- TELA INICIAL -->
<div id="home">
    <h2>Placar Familiar</h2>
    <button onclick="showScreen('result')">Inserir Resultado</button>
    <button onclick="showScreen('ranking')">Ver Ranking</button>
    <button onclick="showScreen('newPerson')">Nova Pessoa</button>
    <button onclick="showScreen('editPerson')">Editar Pessoa</button>
</div>

<!-- RANKING -->
<div id="ranking" class="hidden">
  
    <h2>Ranking</h2>
  <select id="rankingFilter" onchange="loadRanking()">
    <option value="wins">Mais vitórias</option>
    <option value="percentage">Maior % de vitória</option>
</select>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
    </table>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- INSERIR RESULTADO -->
<div id="result" class="hidden">
    <h2>Inserir Resultado</h2>

    <strong>Dupla Vencedora</strong>
    <select id="win1"></select>
    <select id="win2"></select>

    <strong>Dupla Perdedora</strong>
    <select id="lose1"></select>
    <select id="lose2"></select>

    <button class="save" onclick="saveResult()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- NOVA PESSOA -->
<div id="newPerson" class="hidden">
    <h2>Nova Pessoa</h2>
    <input id="newName" placeholder="Nome da pessoa">
    <button class="save" onclick="addPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- EDITAR PESSOA -->
<div id="editPerson" class="hidden">
    <h2>Editar Pessoa</h2>
    <select id="editSelect"></select>
    <input id="editName" placeholder="Novo nome">
    <button class="save" onclick="editPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

</div>

<script>
let people = [];

db.collection("people").onSnapshot(snapshot => {
    people = [];
    snapshot.forEach(doc => {
        people.push({ id: doc.id, ...doc.data() });
    });
});


function saveData() {
    localStorage.setItem("people", JSON.stringify(people));
}

function showScreen(id) {
    document.querySelectorAll(".container > div").forEach(d => d.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");

    if (id === "ranking") loadRanking();
    if (id === "result") loadCombos();
    if (id === "editPerson") loadEditCombo();
}

function addPerson() {
    const name = newName.value.trim();
    if (!name) return alert("Informe um nome");

    db.collection("people").add({
        name,
        games: 0,
        wins: 0
    });

    newName.value = "";
}

//loadRanking começa
function loadRanking() {
    const body = document.getElementById("rankingBody");
    const filter = document.getElementById("rankingFilter").value;
    body.innerHTML = "";

    let sorted = [...people];

    if (filter === "wins") {
        sorted.sort((a, b) => b.wins - a.wins);
    } else if (filter === "percentage") {
        sorted.sort((a, b) => {
            const pctA = a.games ? a.wins / a.games : 0;
            const pctB = b.games ? b.wins / b.games : 0;
            return pctB - pctA;
        });
    }

    sorted.forEach(p => {
        const pct = p.games ? ((p.wins / p.games) * 100).toFixed(1) : 0;
        body.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.games}</td>
                <td>${p.wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}
//loadRanking termina
  
function loadCombos() {
    ["win1","win2","lose1","lose2"].forEach(id => {
        const s = document.getElementById(id);
        s.innerHTML = "";
        people.forEach((p,i) => {
            s.innerHTML += `<option value="${i}">${p.name}</option>`;
        });
    });
}

function saveResult() {
    const ids = [win1.value, win2.value, lose1.value, lose2.value];
    if (new Set(ids).size < 4) {
        return alert("As duplas devem ser diferentes");
    }

    ids.forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ games: firebase.firestore.FieldValue.increment(1) });
    });

    [win1.value, win2.value].forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ wins: firebase.firestore.FieldValue.increment(1) });
    });

    alert("Resultado salvo!");
}


function loadEditCombo() {
    const s = document.getElementById("editSelect");
    s.innerHTML = "";
    people.forEach((p,i) => {
        s.innerHTML += `<option value="${i}">${p.name}</option>`;
    });
}

function editPerson() {
    const idx = editSelect.value;
    const newName = editName.value.trim();
    if (!newName) return;

    db.collection("people")
      .doc(people[idx].id)
      .update({ name: newName });

    editName.value = "";
}
</script>

</body>
</html>
