<!DOCTYPE html>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBwnx21HTz7lXK9ByFk0Cvyma6cQ3EFqIo",
  authDomain: "tranca-bdb16.firebaseapp.com",
  projectId: "tranca-bdb16",
  storageBucket: "tranca-bdb16.firebasestorage.app",
  messagingSenderId: "581913871040",
  appId: "1:581913871040:web:d5209cb2fa308a58b5e325",
  measurementId: "G-VSG09NVFQ4"
};
    
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>♣️♥️Placar Tranca♠️♦️</title>
<style>
* {
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 0;

    background-image: url("bg.jpg"); /* caminho da imagem */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container {
    max-width: 420px;
    margin: 40px auto; /* cria espaço em cima e embaixo */
    background: rgba(255, 255, 255, 0.92);
    padding: 16px;
    border-radius: 16px;
}

h2 {
    text-align: center;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

button.back {
    background: #9e9e9e;
}

button.save {
    background: #2e7d32;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

strong {
    display: block;
    margin-top: 10px;
}

.hidden {
    display: none;
}

/* Ranking */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 14px;
}

th {
    background: #eeeeee;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

/* Filtro ranking */
#rankingFilter {
    margin-bottom: 10px;
}
  .screen {
    background: rgba(255, 255, 255, 0.92);
    padding: 16px;
    border-radius: 16px;
    max-width: 420px;
    margin: auto;
}

select, input {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: #1e73be;
    color: white;
    font-size: 16px;
}

button.secondary {
    background: #999;
}

button:disabled {
    background: #ccc;
}

/* Melhor leitura em telas muito pequenas */
@media (max-width: 360px) {
    table {
        font-size: 13px;
    }
}
</style>
</head>
<body>

<div class="container">

<!-- TELA INICIAL -->
<div id="home">
    <h2>♣️♥️Placar Tranca♠️♦️</h2>
    <button onclick="showLiveScore()">Placar</button>
    <button onclick="showScreen('result')">Inserir Resultado</button>
    <button onclick="showScreen('ranking')">Ranking</button>
    <button onclick="showScreen('duplas')">Visão Duplas</button>
    <button onclick="showScreen('rankingYear')">Ranking por Ano</button>
    <button onclick="showScreen('newPerson')">Nova Pessoa</button>
    <button onclick="showScreen('editPerson')">Editar Pessoa</button>
</div>

<!-- RANKING -->
<div id="ranking" class="hidden">
  
    <h2>Ranking</h2>
  <select id="rankingFilter" onchange="loadRanking()">
    <option value="wins">Mais vitórias</option>
    <option value="percentage">Maior % de vitória</option>
</select>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="rankingBody"></tbody>
    </table>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- INSERIR RESULTADO -->
<div id="result" class="hidden">
    <h2>Inserir Resultado</h2>

    <strong>Dupla Vencedora</strong>
    <select id="win1" onchange="updatePlayerLocks()"></select>
    <select id="win2" onchange="updatePlayerLocks()"></select>

    <strong>Dupla Perdedora</strong>
    <select id="lose1" onchange="updatePlayerLocks()"></select>
    <select id="lose2" onchange="updatePlayerLocks()"></select>

    <button class="save" onclick="saveResult()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- NOVA PESSOA -->
<div id="newPerson" class="hidden">
    <h2>Nova Pessoa</h2>
    <input id="newName" placeholder="Nome da pessoa">
    <button class="save" onclick="addPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

<!-- EDITAR PESSOA -->
<div id="editPerson" class="hidden">
    <h2>Editar Pessoa</h2>
    <select id="editSelect"></select>
    <input id="editName" placeholder="Novo nome">
    <button class="save" onclick="editPerson()">Salvar</button>
    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>
  
<!-- VISÃO DUPLAS -->
<div id="duplas" class="hidden">
    <h2>Visão Duplas</h2>

    <select id="duplaPerson" onchange="loadDuplas()">
        <option value="">Selecione uma pessoa</option>
    </select>

    <table>
        <thead>
            <tr>
                <th>Parceiro</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="duplasBody"></tbody>
    </table>

    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>
  
  <div id="liveScoreScreen" class="screen hidden">
    <h2>Placar</h2>

    <h3>Dupla 1</h3>
    <select id="d1p1"></select>
    <select id="d1p2"></select>
    <p>Pontos: <span id="scoreD1">0</span></p>

    <h3>Dupla 2</h3>
    <select id="d2p1"></select>
    <select id="d2p2"></select>
    <p>Pontos: <span id="scoreD2">0</span></p>

    <hr>

    <h3>Inserir Pontuação da Mão</h3>
    <input type="number" id="pointsD1" placeholder="Dupla 1">
    <input type="number" id="pointsD2" placeholder="Dupla 2">

    <button onclick="addHand()">Adicionar Mão</button>

    <button id="finishGameBtn" disabled onclick="finalizeGameManual()">
        Finalizar Jogo
    </button>

    <button class="secondary" onclick="goHome()">Voltar</button>
</div>

  <!-- RANKING POR ANO -->
<div id="rankingYear" class="hidden">
    <h2>Ranking por Ano</h2>

    <select id="yearSelect" onchange="loadMonths()">
        <option value="">Selecione o ano</option>
    </select>

    <select id="monthSelect" class="hidden" onchange="loadYearRanking()">
        <option value="">Todos os meses</option>
    </select>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Jogos</th>
                <th>Vitórias</th>
                <th>%</th>
            </tr>
        </thead>
        <tbody id="yearRankingBody"></tbody>
    </table>

    <button class="back" onclick="showScreen('home')">Voltar</button>
</div>

</div>

<script>
let people = [];

db.collection("people").onSnapshot(snapshot => {
    people = [];
    snapshot.forEach(doc => {
        people.push({ id: doc.id, ...doc.data() });
    });
});


function saveData() {
    localStorage.setItem("people", JSON.stringify(people));
}

function showScreen(id) {
    document.querySelectorAll(".container > div").forEach(d => d.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");

    if (id === "ranking") loadRanking();
    if (id === "result") loadCombos();
    if (id === "editPerson") loadEditCombo();
    if (id === "duplas") loadDuplasSelect();
    if (id === "rankingYear") loadYears();

}

function addPerson() {
    const name = newName.value.trim();
    if (!name) return alert("Informe um nome");

    db.collection("people").add({
        name,
        games: 0,
        wins: 0
    });

    newName.value = "";
}

//loadRanking começa
function loadRanking() {
    const body = document.getElementById("rankingBody");
    const filter = document.getElementById("rankingFilter").value;
    body.innerHTML = "";

    let sorted = [...people];

    if (filter === "wins") {
        sorted.sort((a, b) => b.wins - a.wins);
    } else if (filter === "percentage") {
        sorted.sort((a, b) => {
            const pctA = a.games ? a.wins / a.games : 0;
            const pctB = b.games ? b.wins / b.games : 0;
            return pctB - pctA;
        });
    }

    sorted.forEach(p => {
        const pct = p.games ? ((p.wins / p.games) * 100).toFixed(1) : 0;
        body.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${p.games}</td>
                <td>${p.wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}
//loadRanking termina
  
function loadCombos() {
    const sortedPeople = getPeopleSortedByName();

    ["win1","win2","lose1","lose2"].forEach(id => {
        const s = document.getElementById(id);
        s.innerHTML = "<option value=''>Selecione</option>";

        sortedPeople.forEach(p => {
            const index = people.findIndex(x => x.id === p.id);
            s.innerHTML += `<option value="${index}">${p.name}</option>`;
        });
    });

    updatePlayerLocks();
}

function saveResult() {
    const ids = [win1.value, win2.value, lose1.value, lose2.value];
    if (new Set(ids).size < 4) {
        return alert("As duplas devem ser diferentes");
    }

    ids.forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ games: firebase.firestore.FieldValue.increment(1) });
    });

    [win1.value, win2.value].forEach(i => {
        const ref = db.collection("people").doc(people[i].id);
        ref.update({ wins: firebase.firestore.FieldValue.increment(1) });
    });
  
  db.collection("matches").add({
    teamWin: [
        people[win1.value].id,
        people[win2.value].id
    ],
    teamLose: [
        people[lose1.value].id,
        people[lose2.value].id
    ],
    date: new Date(),          // data do device
    year: new Date().getFullYear(),
    month: new Date().getMonth() + 1 // 1 a 12
});


    alert("Resultado salvo!");
}

function loadEditCombo() {
    const s = document.getElementById("editSelect");
    s.innerHTML = "";

    getPeopleSortedByName().forEach(p => {
        const index = people.findIndex(x => x.id === p.id);
        s.innerHTML += `<option value="${index}">${p.name}</option>`;
    });
}

function editPerson() {
    const idx = editSelect.value;
    const newName = editName.value.trim();
    if (!newName) return;

    db.collection("people")
      .doc(people[idx].id)
      .update({ name: newName });

    editName.value = "";
}

  function updatePlayerLocks() {
    const selects = [win1, win2, lose1, lose2];

    // valores já escolhidos
    const selectedValues = selects
        .map(s => s.value)
        .filter(v => v !== "");

    selects.forEach(currentSelect => {
        [...currentSelect.options].forEach(option => {
            // nunca desabilitar a opção que já está selecionada nesse select
            if (option.value === currentSelect.value) {
                option.disabled = false;
            } else {
                option.disabled = selectedValues.includes(option.value);
            }
        });
    });
}

  function loadDuplasSelect() {
    const select = document.getElementById("duplaPerson");
    select.innerHTML = "<option value=''>Selecione uma pessoa</option>";

    getPeopleSortedByName().forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
    });
}

  async function loadDuplas() {
    const personId = document.getElementById("duplaPerson").value;
    const body = document.getElementById("duplasBody");
    body.innerHTML = "";

    if (!personId) return;

    const snapshot = await db.collection("matches").get();
    const stats = {};

    snapshot.forEach(doc => {
        const m = doc.data();

        const isWin = m.teamWin.includes(personId);
        const isLose = m.teamLose.includes(personId);

        if (!isWin && !isLose) return;

        const team = isWin ? m.teamWin : m.teamLose;
        const partnerId = team.find(id => id !== personId);

        if (!stats[partnerId]) {
            stats[partnerId] = { games: 0, wins: 0 };
        }

        stats[partnerId].games++;
        if (isWin) stats[partnerId].wins++;
    });

    Object.keys(stats).forEach(pid => {
        const partner = people.find(p => p.id === pid);
        if (!partner) return;

        const games = stats[pid].games;
        const wins = stats[pid].wins;
        const pct = games ? ((wins / games) * 100).toFixed(1) : 0;

        body.innerHTML += `
            <tr>
                <td>${partner.name}</td>
                <td>${games}</td>
                <td>${wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}

  function getPeopleSortedByName() {
    return [...people].sort((a, b) =>
        a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' })
    );
}

async function loadYears() {
    const select = document.getElementById("yearSelect");
    select.innerHTML = "<option value=''>Selecione o ano</option>";

    const snapshot = await db.collection("matches").get();
    const years = new Set();

    snapshot.forEach(doc => {
        years.add(doc.data().year);
    });

    [...years].sort().forEach(y => {
        select.innerHTML += `<option value="${y}">${y}</option>`;
    });
}

  function loadMonths() {
    const year = yearSelect.value;
    const monthSelect = document.getElementById("monthSelect");

    if (!year) {
        monthSelect.classList.add("hidden");
        return;
    }

    monthSelect.classList.remove("hidden");
    monthSelect.innerHTML = `
        <option value="">Anual</option>
        <option value="1">Janeiro</option>
        <option value="2">Fevereiro</option>
        <option value="3">Março</option>
        <option value="4">Abril</option>
        <option value="5">Maio</option>
        <option value="6">Junho</option>
        <option value="7">Julho</option>
        <option value="8">Agosto</option>
        <option value="9">Setembro</option>
        <option value="10">Outubro</option>
        <option value="11">Novembro</option>
        <option value="12">Dezembro</option>
    `;

    loadYearRanking();
}

  async function loadYearRanking() {
    const year = parseInt(yearSelect.value);
    const month = monthSelect.value ? parseInt(monthSelect.value) : null;
    const body = document.getElementById("yearRankingBody");
    body.innerHTML = "";

    if (!year) return;

    const snapshot = await db.collection("matches")
        .where("year", "==", year)
        .get();

    const stats = {};

    snapshot.forEach(doc => {
        const m = doc.data();
        if (month && m.month !== month) return;

        [...m.teamWin, ...m.teamLose].forEach(pid => {
            if (!stats[pid]) stats[pid] = { games: 0, wins: 0 };
            stats[pid].games++;
        });

        m.teamWin.forEach(pid => {
            stats[pid].wins++;
        });
    });

    Object.keys(stats).forEach(pid => {
        const p = people.find(x => x.id === pid);
        if (!p) return;

        const games = stats[pid].games;
        const wins = stats[pid].wins;
        const pct = ((wins / games) * 100).toFixed(1);

        body.innerHTML += `
            <tr>
                <td>${p.name}</td>
                <td>${games}</td>
                <td>${wins}</td>
                <td>${pct}%</td>
            </tr>
        `;
    });
}
  let game = {
    dupla1: { players: [], score: 0 },
    dupla2: { players: [], score: 0 },
    finished: false
};

  function showLiveScore() {
    hideAllScreens();
    document
        .getElementById("liveScoreScreen")
        .classList.remove("hidden");
}

  function loadPlayersIntoCombos() {
    const selects = ["d1p1", "d1p2", "d2p1", "d2p2"];
    selects.forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = `<option value="">Selecione</option>`;
        people.forEach(p => {
            sel.innerHTML += `<option value="${p.name}">${p.name}</option>`;
        });
    });
}

  function addHand() {
    const p1 = Number(pointsD1.value) || 0;
    const p2 = Number(pointsD2.value) || 0;

    game.dupla1.score += p1;
    game.dupla2.score += p2;

    updateScore();
    checkWinner();

    pointsD1.value = "";
    pointsD2.value = "";
}
  
function updateScore() {
    scoreD1.innerText = game.dupla1.score;
    scoreD2.innerText = game.dupla2.score;
}

  function checkWinner() {
    const s1 = game.dupla1.score;
    const s2 = game.dupla2.score;

    if (s1 >= 2000 || s2 >= 2000) {
        document.getElementById("finishGameBtn").disabled = false;

        if (s1 !== s2) {
            finalizeGame();
        }
    }
}
  
function finalizeGame() {
    if (game.finished) return;
    game.finished = true;

    game.dupla1.players = [
        d1p1.value,
        d1p2.value
    ];
    game.dupla2.players = [
        d2p1.value,
        d2p2.value
    ];

    let winners, losers;

    if (game.dupla1.score > game.dupla2.score) {
        winners = game.dupla1.players;
        losers = game.dupla2.players;
    } else {
        winners = game.dupla2.players;
        losers = game.dupla1.players;
    }

    saveMatch(winners, losers);
    alert("Jogo encerrado! Vitória registrada.");
    goHome();
}

  function finalizeGameManual() {
    finalizeGame();
}

  async function saveMatch(winners, losers) {
    const now = new Date();

    await addDoc(collection(db, "matches"), {
        winners,
        losers,
        date: now.toISOString(),
        year: now.getFullYear(),
        month: now.getMonth() + 1
    });
}

  function goHome() {
    game = {
        dupla1: { players: [], score: 0 },
        dupla2: { players: [], score: 0 },
        finished: false
    };
    updateScore();
    hideAllScreens();
    document.getElementById("homeScreen").classList.remove("hidden");
}
  
  function hideAllScreens() {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.add("hidden");
    });
}

</script>

</body>
</html>
